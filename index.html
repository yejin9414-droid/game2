<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별빛 수비대</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #12052e 0%, #030108 75%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: min(800px, 100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border: 2px solid #00f0ff;
    border-radius: 10px;
    box-shadow: 0 0 12px #00f0ff, 0 0 40px #ff2bd655, inset 0 0 20px #00f0ff44;
    cursor: crosshair;
  }
  /* 시작/결과 화면 */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    background: rgba(6, 2, 20, 0.72);
    border-radius: 10px;
    color: #fff;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #title {
    font-size: clamp(36px, 9vw, 76px);
    font-weight: 900;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 16px #ff2bd6, 0 0 32px #ff2bd6, 0 0 60px #ff2bd6;
    animation: flicker 3s infinite;
  }
  @keyframes flicker {
    0%, 92%, 96%, 100% { opacity: 1; }
    94% { opacity: 0.55; }
  }
  #subtitle {
    font-size: clamp(14px, 2.4vw, 18px);
    color: #9ff8ff;
    text-shadow: 0 0 8px #00f0ff;
    line-height: 1.8;
  }
  #startBtn {
    font-size: clamp(18px, 3.5vw, 26px);
    font-weight: bold;
    padding: 14px 46px;
    border: 2px solid #00f0ff;
    border-radius: 40px;
    background: transparent;
    color: #e8feff;
    text-shadow: 0 0 8px #00f0ff;
    cursor: pointer;
    box-shadow: 0 0 12px #00f0ff, inset 0 0 12px #00f0ff;
    transition: all 0.15s;
  }
  #startBtn:hover {
    background: #00f0ff22;
    transform: scale(1.08);
    box-shadow: 0 0 24px #00f0ff, 0 0 48px #00f0ff88, inset 0 0 16px #00f0ff;
  }
  /* 소리 켜기/끄기 버튼 */
  #soundBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 10;
    font-size: 14px;
    font-weight: bold;
    padding: 6px 12px;
    border: 2px solid #ff2bd6;
    border-radius: 20px;
    background: rgba(6, 2, 20, 0.6);
    color: #ffd6f6;
    text-shadow: 0 0 6px #ff2bd6;
    box-shadow: 0 0 10px #ff2bd6;
    cursor: pointer;
  }
  #soundBtn.off {
    border-color: #666;
    color: #999;
    text-shadow: none;
    box-shadow: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <button id="soundBtn">🔊 소리 켬</button>
  <div id="overlay">
    <div id="title">별빛 수비대</div>
    <div id="subtitle">
      ← → 방향키 또는 마우스로 이동<br>
      스페이스바 또는 마우스 클릭으로 발사<br>
      <span style="color:#39ff14;text-shadow:0 0 8px #39ff14">● 초록 아이템</span> 10초 동안 총알 두 발 &nbsp;
      <span style="color:#ffe600;text-shadow:0 0 8px #ffe600">● 노랑 아이템</span> 방어막
    </div>
    <button id="startBtn">게임 시작</button>
  </div>
</div>

<script>
// ===== 기본 준비 =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById("overlay");
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const startBtn = document.getElementById("startBtn");
const soundBtn = document.getElementById("soundBtn");

// 줄마다 다른 네온 색깔 (위에서부터: 분홍, 노랑, 초록, 하늘)
const ROW_COLORS = ["#ff2bd6", "#ffe600", "#39ff14", "#00f0ff"];
const ROWS = 4, COLS = 8;

// 게임 배경 그림 (폴더의 배경 일러스트 70.jpg)
const bgImg = new Image();
bgImg.src = "배경 일러스트 70.jpg";

// 예전 배경 그림 (성운) - 배경 그림을 불러오기 전에만 잠깐 보임
const bgCanvas = document.createElement("canvas");
bgCanvas.width = W; bgCanvas.height = H;
(function makeBackground() {
  const b = bgCanvas.getContext("2d");
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#05010f");
  g.addColorStop(1, "#12021f");
  b.fillStyle = g;
  b.fillRect(0, 0, W, H);
  const clouds = [
    [180, 160, 260, "rgba(123, 44, 255, 0.22)"],
    [640, 120, 220, "rgba(255, 43, 214, 0.15)"],
    [520, 380, 300, "rgba(0, 240, 255, 0.10)"],
  ];
  for (const [x, y, r, c] of clouds) {
    const rg = b.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, c);
    rg.addColorStop(1, "rgba(0,0,0,0)");
    b.fillStyle = rg;
    b.fillRect(0, 0, W, H);
  }
})();

// 반짝이는 별 (멀리 있는 별은 작고 느리게, 가까운 별은 크고 조금 빠르게)
const STAR_COLORS = ["#ffffff", "#9ff8ff", "#ffc2f2"];
const stars = [];
for (let i = 0; i < 160; i++) {
  const depth = Math.random();            // 0 = 멀리, 1 = 가까이
  stars.push({ x: Math.random() * W, y: Math.random() * H,
               size: 0.6 + depth * 1.8,
               speed: 0.08 + depth * 0.35,  // 천천히 아래로
               twinkle: Math.random() * Math.PI * 2,
               color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)] });
}

// 게임 상태
let state = "ready";   // ready(대기) / playing(게임 중) / over(게임 오버)
let ship, aliens;
let bullets = [], alienBullets = [], particles = [], items = [];
let alienDir, alienSpeed, alienShootTimer, score, frame = 0;
let lives, stage;              // 목숨, 스테이지
let formX, formY;              // 외계인 대열 전체가 움직인 거리
let diveTimer;                 // 다음 급강하까지 남은 시간
let doubleShot = 0;            // 두 발 쏘기 남은 시간 (60 = 1초)
let shield = false;            // 방어막 있는지
let invincible = 0;            // 맞은 직후 잠깐 무적 시간
let banner = 0;                // "STAGE 1" 글씨 보여주는 시간
let shake = 0; // 화면 흔들림
const keys = {};

// ===== 소리 (Web Audio로 직접 만들기) =====
let audioCtx = null, master = null, soundOn = true;

// 소리 장치 준비 (브라우저는 버튼을 눌러야 소리를 낼 수 있어서 시작 버튼에서 부름)
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = soundOn ? 0.5 : 0;
    master.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

// 삐- 하는 기본 음 하나 내기
function tone(freq, endFreq, dur, type, vol, delay = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(master);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// 치익- 하는 잡음 (폭발 소리용)
function noise(dur, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(3000, t);
  filter.frequency.exponentialRampToValueAtTime(150, t + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter).connect(gain).connect(master);
  src.start(t);
}

function sfxShoot()   { tone(1200, 300, 0.12, "square", 0.08); }
function sfxExplode() { noise(0.3, 0.35); tone(180, 40, 0.25, "triangle", 0.25); }
function sfxGameOver() {
  noise(0.8, 0.5);
  [440, 370, 311, 220].forEach((f, i) => tone(f, f * 0.97, 0.3, "sawtooth", 0.12, 0.25 + i * 0.25));
}
function sfxClear() {
  [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, null, 0.25, "square", 0.08, i * 0.12));
}
function sfxItem()   { [660, 880, 1320].forEach((f, i) => tone(f, null, 0.12, "triangle", 0.15, i * 0.07)); }
function sfxHurt()   { noise(0.4, 0.45); tone(300, 60, 0.4, "sawtooth", 0.2); }
function sfxShield() { tone(1500, 200, 0.35, "sine", 0.25); }
function sfxDive()   { tone(900, 250, 0.5, "sine", 0.06); }

// ===== 배경음악 (음악 파일 없이 Web Audio로 직접 연주) =====
// 음 번호(69 = 라)를 진동수(Hz)로 바꾸기. 0 은 쉼표
function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }

// 정해진 시각에 음 하나 연주하기
function playNoteAt(freq, t, dur, type, vol) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(master);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// 평소 배경음악: 32칸짜리 짧은 멜로디를 계속 반복
const MAIN_SONG = {
  stepDur: 0.2,  // 한 칸 길이 (초)
  melody: [69, 0, 72, 76,  74, 0, 72, 69,  67, 0, 69, 72,  71, 0, 67, 0,
           69, 0, 72, 76,  79, 0, 77, 76,  74, 72, 71, 72,  69, 0, 0, 0],
  bassEvery: 4,  // 4칸마다 낮은 음 하나
  bass: [45, 45, 41, 41, 43, 43, 40, 40],
};
// 무적 음악: 더 빠르고 신나는 16칸 멜로디
const STAR_SONG = {
  stepDur: 0.1,
  melody: [72, 76, 79, 84,  79, 76, 72, 76,  74, 77, 81, 86,  81, 77, 74, 77],
  bassEvery: 8,
  bass: [48, 50],
};

const music = { timer: null, song: null, step: 0, nextTime: 0 };

// 조금 앞의 음들을 미리 예약해 두기 (소리가 끊기지 않게)
function musicScheduler() {
  const s = music.song;
  while (music.nextTime < audioCtx.currentTime + 0.1) {
    const i = music.step % s.melody.length;
    if (s.melody[i]) playNoteAt(midi(s.melody[i]), music.nextTime, s.stepDur * 0.9, "square", 0.05);
    if (i % s.bassEvery === 0) {
      const b = s.bass[Math.floor(i / s.bassEvery) % s.bass.length];
      playNoteAt(midi(b), music.nextTime, s.stepDur * s.bassEvery * 0.9, "triangle", 0.12);
    }
    music.nextTime += s.stepDur;
    music.step++;
  }
}
function playSong(song) {
  stopSong();
  if (!audioCtx) return;
  music.song = song;
  music.step = 0;
  music.nextTime = audioCtx.currentTime + 0.05;
  music.timer = setInterval(musicScheduler, 25);
}
function stopSong() {
  clearInterval(music.timer);
  music.timer = null;
}

let starMusic = 0;               // 무적 음악 남은 시간 (60 = 1초)

function startBgm() { playSong(MAIN_SONG); }
function stopBgm() {
  stopSong();
  starMusic = 0;
}
// 아이템을 먹었을 때: 무적 음악으로 바꾸기
function startStarMusic() {
  starMusic = 600; // 10초 (아이템 효과 시간과 같음)
  playSong(STAR_SONG);
}
// 시간이 다 되면: 평소 배경음악으로 돌아가기
function endStarMusic() { startBgm(); }

// 소리 켜기/끄기 버튼
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  if (master) master.gain.value = soundOn ? 0.5 : 0; // 효과음과 배경음악이 함께 켜지고 꺼짐
  soundBtn.textContent = soundOn ? "🔊 소리 켬" : "🔇 소리 끔";
  soundBtn.classList.toggle("off", !soundOn);
  soundBtn.blur(); // 스페이스바를 눌러도 이 버튼이 다시 눌리지 않게
});

// ===== 게임 시작 (처음 상태로 초기화) =====
function startGame() {
  initAudio();
  // w, h = 맞는 범위 (그림 속 비행기 크기에 맞춤: 56px 그림 중 비행기 부분이 약 52px)
  ship = { x: W / 2, y: H - 50, w: 58, h: 40, speed: 6, cooldown: 0 };
  particles = [];
  items = [];
  score = 0;
  lives = 3;
  stage = 1;
  doubleShot = 0;
  shield = false;
  invincible = 0;
  shake = 0;
  setupStage();
  state = "playing";
  overlay.classList.add("hidden");
  startBgm();
}

// ===== 스테이지 준비 (외계인 새로 배치) =====
function setupStage() {
  bullets = [];
  alienBullets = [];
  aliens = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      // mode: form(대열) / dive(급강하 중) / return(대열로 돌아가는 중)
      aliens.push({ x: 0, y: 0, w: 38, h: 28, row: r, col: c, alive: true, mode: "form", angle: 0 });
    }
  }
  formX = 0;
  formY = -230;  // 화면 위에서 내려오며 등장
  alienDir = 1;
  alienSpeed = 0.8 + (stage - 1) * 0.35;  // 스테이지가 오를수록 빨라짐
  alienShootTimer = 90;
  diveTimer = 200;
  banner = 150;
}

// 외계인이 대열에서 있어야 할 자리
function homeX(a) { return 140 + a.col * 66 + formX; }
function homeY(a) { return 70 + a.row * 52 + formY; }

// ===== 결과 화면 띄우기 =====
function endGame() {
  state = "over";
  stopBgm();
  sfxGameOver();
  shake = 20;
  titleEl.textContent = "게임 오버";
  titleEl.style.textShadow = "0 0 6px #fff, 0 0 16px #ff1744, 0 0 32px #ff1744, 0 0 60px #ff1744";
  subtitleEl.innerHTML = "점수: " + score + "<br>스테이지: " + stage;
  startBtn.textContent = "다시 하기";
  overlay.classList.remove("hidden");
}

// ===== 조작: 키보드 =====
document.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Space" || e.code.startsWith("Arrow")) e.preventDefault();
});
document.addEventListener("keyup", e => { keys[e.code] = false; });

// ===== 조작: 마우스 =====
canvas.addEventListener("mousemove", e => {
  if (state !== "playing") return;
  const rect = canvas.getBoundingClientRect();
  ship.x = (e.clientX - rect.left) * (W / rect.width);
  ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
});
canvas.addEventListener("mousedown", () => { if (state === "playing") shoot(); });

startBtn.addEventListener("click", () => { startBtn.blur(); startGame(); });

// ===== 총알 쏘기 =====
function shoot() {
  if (ship.cooldown > 0) return;
  if (doubleShot > 0) {
    // 초록 아이템 효과: 두 발씩
    bullets.push({ x: ship.x - 10, y: ship.y - ship.h / 2, speed: 9 });
    bullets.push({ x: ship.x + 10, y: ship.y - ship.h / 2, speed: 9 });
  } else {
    bullets.push({ x: ship.x, y: ship.y - ship.h / 2, speed: 9 });
  }
  ship.cooldown = 15; // 연속 발사 간격
  sfxShoot();
}

// ===== 폭발 효과 =====
// 빛 알갱이 + 빙글빙글 도는 작은 조각 + 퍼지는 빛 고리
function explode(x, y, color, count = 22) {
  // 빛 알갱이
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const sp = Math.random() * 4 + 1;
    particles.push({ type: "spark", x, y, vx: Math.cos(angle) * sp, vy: Math.sin(angle) * sp,
                     life: 40, maxLife: 40, color });
  }
  // 외계인 몸에서 떨어져 나온 조각 (돌면서 날아가다 아래로 떨어짐)
  for (let i = 0; i < Math.floor(count / 2); i++) {
    const angle = Math.random() * Math.PI * 2;
    const sp = Math.random() * 3 + 1.5;
    particles.push({ type: "shard", x, y, vx: Math.cos(angle) * sp, vy: Math.sin(angle) * sp - 1.5,
                     size: Math.random() * 5 + 3, rot: Math.random() * Math.PI,
                     spin: (Math.random() - 0.5) * 0.4,
                     life: 60, maxLife: 60, color });
  }
  // 퍼지는 빛 고리
  particles.push({ type: "ring", x, y, vx: 0, vy: 0, r: 4, life: 20, maxLife: 20, color });
}

// 두 사각형이 겹치는지 검사
function hit(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

// ===== 매 순간 게임 내용 바꾸기 =====
function update() {
  frame++;
  if (shake > 0) shake *= 0.9;
  if (shake < 0.5) shake = 0;

  // 별 흐르기 (항상)
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }

  // 폭발 조각 (항상)
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.type === "shard") {
      p.vy += 0.12;       // 조각은 아래로 떨어짐
      p.rot += p.spin;    // 빙글빙글
    } else if (p.type === "ring") {
      p.r += 2.5;         // 고리가 점점 커짐
    } else {
      p.vx *= 0.96; p.vy *= 0.96;
    }
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  if (state !== "playing") return;

  // 우주선 이동
  if (keys["ArrowLeft"])  ship.x -= ship.speed;
  if (keys["ArrowRight"]) ship.x += ship.speed;
  ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
  if (keys["Space"]) shoot();
  if (ship.cooldown > 0) ship.cooldown--;
  if (doubleShot > 0) doubleShot--;
  if (starMusic > 0) {
    starMusic--;
    if (starMusic === 0) endStarMusic();
  }
  if (invincible > 0) invincible--;
  if (banner > 0) banner--;

  // 내 총알 이동
  for (const b of bullets) b.y -= b.speed;
  bullets = bullets.filter(b => b.y > -10);

  const alive = aliens.filter(a => a.alive);
  const entering = formY < 0; // 대열이 아직 화면 위에서 내려오는 중

  // 대열 이동: 끝에 닿으면 방향 바꾸고 한 칸 내려오기
  if (entering) {
    formY = Math.min(0, formY + 2.5);
  } else {
    formX += alienDir * alienSpeed;
    let hitEdge = false;
    for (const a of alive) {
      const hx = homeX(a);
      if (hx - a.w / 2 < 10 || hx + a.w / 2 > W - 10) hitEdge = true;
    }
    if (hitEdge) {
      alienDir *= -1;
      formX += alienDir * alienSpeed;
      formY += 18;
    }
  }

  // 급강하 시작: 가끔 대열의 외계인 하나가 빠져나옴 (스테이지가 높을수록 자주, 여러 마리)
  const diving = alive.filter(a => a.mode !== "form").length;
  const maxDivers = Math.min(1 + Math.floor(stage / 2), 5);
  if (!entering) diveTimer--;
  if (diveTimer <= 0 && diving < maxDivers) {
    const ready = alive.filter(a => a.mode === "form");
    if (ready.length > 0) {
      const a = ready[Math.floor(Math.random() * ready.length)];
      const side = a.x < W / 2 ? -1 : 1;  // 바깥쪽으로 크게 돌면서 나감
      a.mode = "dive";
      a.t = 0;
      a.shot = false;
      a.speedT = 0.0055 + stage * 0.0007;
      // 곡선(베지어)의 점 4개: 출발 → 위로 살짝 → 옆으로 크게 휘어짐 → 비행기 쪽 아래로
      a.path = [
        { x: a.x, y: a.y },
        { x: a.x + side * 140, y: a.y - 90 },
        { x: ship.x - side * 260, y: H * 0.55 },
        { x: ship.x + side * 60, y: H + 50 },
      ];
      sfxDive();
    }
    diveTimer = Math.max(50, 260 - stage * 35) + Math.random() * 60;
  }

  // 외계인 하나하나 위치 정하기
  for (const a of alive) {
    if (a.mode === "form") {
      a.x = homeX(a); a.y = homeY(a); a.angle = 0;
    } else if (a.mode === "dive") {
      a.t += a.speedT;
      const t = Math.min(a.t, 1), u = 1 - t, [p0, p1, p2, p3] = a.path;
      const nx = u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x;
      const ny = u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y;
      a.angle = Math.atan2(ny - a.y, nx - a.x) - Math.PI / 2; // 날아가는 방향으로 몸을 돌림
      a.x = nx; a.y = ny;
      // 내려오는 도중에 한 번 총알 발사
      if (!a.shot && a.t > 0.45) {
        a.shot = true;
        alienBullets.push({ x: a.x, y: a.y + a.h / 2, w: 6, h: 14, speed: Math.min(4 + stage * 0.3, 7) });
      }
      // 화면 아래로 나가면 위에서 다시 나타나 대열로 돌아감
      if (a.t >= 1) { a.mode = "return"; a.x = homeX(a); a.y = -40; a.angle = 0; }
    } else if (a.mode === "return") {
      const dx = homeX(a) - a.x, dy = homeY(a) - a.y;
      const dist = Math.hypot(dx, dy), sp = 3 + stage * 0.3;
      if (dist <= sp) a.mode = "form";
      else { a.x += dx / dist * sp; a.y += dy / dist * sp; }
    }
  }

  // 외계인 총알 발사 (대열에 있는 외계인 중 무작위)
  alienShootTimer--;
  const shooters = alive.filter(a => a.mode === "form");
  if (!entering && alienShootTimer <= 0 && shooters.length > 0) {
    const s = shooters[Math.floor(Math.random() * shooters.length)];
    alienBullets.push({ x: s.x, y: s.y + s.h / 2, w: 6, h: 14, speed: Math.min(4 + stage * 0.3, 7) });
    alienShootTimer = Math.max(20, 70 - stage * 5 - (ROWS * COLS - alive.length) * 1.2);
  }
  for (const b of alienBullets) b.y += b.speed;
  alienBullets = alienBullets.filter(b => b.y < H + 20);

  // 내 총알이 외계인에 맞았는지
  for (const b of bullets) {
    for (const a of alive) {
      if (a.alive && hit({ x: b.x, y: b.y, w: 4, h: 14 }, a)) {
        a.alive = false;
        b.y = -100; // 총알 없애기
        score += 10; // 한 마리에 10점
        explode(a.x, a.y, ROW_COLORS[a.row]);
        sfxExplode();
        shake = Math.max(shake, 4);
        alienSpeed += 0.03; // 남은 외계인이 점점 빨라짐
        // 10% 확률로 아이템 떨어뜨리기 (초록 또는 노랑 반반)
        if (Math.random() < 0.1) {
          items.push({ x: a.x, y: a.y, w: 24, h: 24, type: Math.random() < 0.5 ? "green" : "yellow" });
        }
        break;
      }
    }
  }

  // 아이템 떨어지기 + 줍기
  for (const it of items) {
    it.y += 2.2;
    if (hit(it, ship)) {
      it.y = H + 100; // 주운 아이템 없애기
      sfxItem();
      startStarMusic(); // 무적 음악 시작!
      if (it.type === "green") {
        doubleShot = 600; // 10초 (1초 = 60)
        explode(ship.x, ship.y, "#39ff14", 14);
      } else {
        shield = true;
        explode(ship.x, ship.y, "#ffe600", 14);
      }
    }
  }
  items = items.filter(it => it.y < H + 20);

  // 외계인 총알에 우주선이 맞았는지
  for (const b of alienBullets) {
    if (hit(b, ship) && (invincible === 0 || starMusic > 0)) {
      b.y = H + 100; // 맞은 총알 없애기
      if (starMusic === 0) hurtShip(); // 무적일 때는 총알만 사라지고 안 다침
    }
  }
  // 외계인과 부딪혔는지 (부딪힌 외계인도 터짐)
  for (const a of alive) {
    if (a.alive && hit(a, ship) && (invincible === 0 || starMusic > 0)) {
      a.alive = false;
      explode(a.x, a.y, ROW_COLORS[a.row]);
      if (starMusic > 0) sfxExplode(); // 무적이면 부딪힌 외계인만 터지고 안 다침
      else hurtShip();
    }
  }
  if (state !== "playing") return;

  // 대열이 우주선 있는 곳까지 내려오면 게임 오버
  // (단, 무적일 때는 바닥에 닿은 외계인만 터지고 게임은 계속됨)
  for (const a of alive) {
    if (a.alive && a.mode === "form" && a.y + a.h / 2 >= ship.y - ship.h / 2) {
      if (starMusic > 0) {
        a.alive = false;
        explode(a.x, a.y, ROW_COLORS[a.row]);
        sfxExplode();
      } else {
        explode(ship.x, ship.y, "#00f0ff", 50); endGame(); return;
      }
    }
  }

  // 외계인을 모두 물리치면 다음 스테이지로
  if (aliens.every(a => !a.alive)) {
    stage++;
    sfxClear();
    setupStage();
  }
}

// ===== 우주선이 맞았을 때 =====
function hurtShip() {
  if (invincible > 0 || starMusic > 0 || state !== "playing") return;
  if (shield) {
    // 노랑 아이템 방어막이 대신 막아줌
    shield = false;
    invincible = 60;
    explode(ship.x, ship.y, "#ffe600", 30);
    sfxShield();
    shake = Math.max(shake, 8);
    return;
  }
  lives--;
  explode(ship.x, ship.y, "#00f0ff", 50);
  shake = Math.max(shake, 12);
  if (lives <= 0) { endGame(); return; }
  sfxHurt();
  invincible = 120; // 2초 동안 무적 (깜빡임)
}

// ===== 그리기: 바닥의 네온 격자 =====
function drawGrid() {
  ctx.save();
  ctx.strokeStyle = "rgba(255, 43, 214, 0.22)";
  ctx.lineWidth = 1;
  const top = H - 110;
  // 가로줄 (앞으로 흘러오는 느낌)
  const offset = (frame * 0.6) % 20;
  for (let i = 0; i < 7; i++) {
    const t = (i * 20 + offset) / 140;
    const y = top + t * t * 110;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // 세로줄 (원근감)
  for (let i = -10; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(W / 2 + i * 20, top);
    ctx.lineTo(W / 2 + i * 90, H);
    ctx.stroke();
  }
  ctx.restore();
}

// ===== 그리기: 내 비행기 (폴더의 fish.png 그림 사용) =====
const shipImg = new Image();
shipImg.src = "fish.png"; // 붕어.jpg 에서 흰 배경과 테두리를 지운 그림
const SHIP_H = 46;              // 화면에 그릴 높이 (픽셀)
const SHIP_W = SHIP_H * 173 / 120; // 그림 비율(가로 173 : 세로 120)에 맞춘 너비

function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  // 엔진 불꽃 (깜빡임)
  const flame = 10 + Math.sin(frame * 0.5) * 5;
  const tail = SHIP_H / 2 - 4; // 비행기 꼬리 위치
  ctx.shadowColor = "#ff2bd6"; ctx.shadowBlur = 20;
  ctx.fillStyle = "#ff2bd6";
  ctx.beginPath();
  ctx.moveTo(-6, tail); ctx.lineTo(0, tail + flame); ctx.lineTo(6, tail);
  ctx.fill();

  // 비행기 그림 (그림이 다 불러와졌을 때만)
  if (shipImg.complete && shipImg.naturalWidth > 0) {
    if (starMusic > 0) {
      // 무적일 때: 무지개색으로 번쩍번쩍 빛나기
      ctx.shadowColor = "hsl(" + (frame * 12) % 360 + ", 100%, 60%)";
      ctx.shadowBlur = 30;
    } else {
      ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 14;
    }
    ctx.drawImage(shipImg, -SHIP_W / 2, -SHIP_H / 2, SHIP_W, SHIP_H);
  }
  ctx.restore();
}

// ===== 그리기: 외계인 (줄마다 모양도 다름, 네온 테두리) =====
function drawAlien(a) {
  const color = ROW_COLORS[a.row];
  const wiggle = Math.sin(frame * 0.15 + a.x * 0.05) * 3; // 다리/더듬이 흔들림
  ctx.save();
  ctx.translate(a.x, a.y);
  if (a.angle) ctx.rotate(a.angle); // 급강하할 때 몸을 기울임
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = color + "33";  // 속은 반투명하게
  ctx.strokeStyle = color;       // 테두리는 밝게
  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  if (a.row === 0) {
    // 해파리형
    ctx.beginPath(); ctx.arc(0, -2, 14, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 6, -2);
      ctx.quadraticCurveTo(i * 6 + wiggle, 6, i * 6, 14); ctx.stroke();
    }
  } else if (a.row === 1) {
    // 게형
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-18, -6 + wiggle, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(18, -6 - wiggle, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-12, 14); ctx.moveTo(8, 8); ctx.lineTo(12, 14); ctx.stroke();
  } else if (a.row === 2) {
    // 외눈 다이아몬드형
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(16, 0); ctx.lineTo(0, 14); ctx.lineTo(-16, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(-8 + wiggle, -20);
    ctx.moveTo(4, -12); ctx.lineTo(8 + wiggle, -20); ctx.stroke();
  } else {
    // 비행접시형
    ctx.beginPath(); ctx.arc(0, 0, 9, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 4, 18, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = (Math.floor(frame / 10) % 2) ? "#fff" : color;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 10, 4, 2, 0, Math.PI * 2); ctx.fill(); }
  }

  // 빛나는 눈
  ctx.fillStyle = "#fff";
  ctx.shadowColor = "#fff";
  if (a.row === 2) {
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  } else if (a.row !== 3) {
    const ey = a.row === 0 ? -7 : -1;
    ctx.beginPath(); ctx.arc(-5, ey, 2.5, 0, Math.PI * 2); ctx.arc(5, ey, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ===== 그리기: 하트 (목숨) =====
function drawHeart(x, y, s, full) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, s * 0.9);
  ctx.bezierCurveTo(-s * 1.3, 0, -s * 0.6, -s * 1.05, 0, -s * 0.35);
  ctx.bezierCurveTo(s * 0.6, -s * 1.05, s * 1.3, 0, 0, s * 0.9);
  ctx.closePath();
  ctx.lineWidth = 2;
  if (full) {
    ctx.shadowColor = "#ff2b6a"; ctx.shadowBlur = 12;
    ctx.fillStyle = "#ff2b6a";
    ctx.fill();
  } else {
    ctx.strokeStyle = "#555"; // 잃은 목숨은 회색 빈 하트
    ctx.stroke();
  }
  ctx.restore();
}

// ===== 그리기: 아이템 (빛나는 구슬) =====
function drawItem(it) {
  const color = it.type === "green" ? "#39ff14" : "#ffe600";
  const pulse = 1 + Math.sin(frame * 0.2) * 0.12;
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.fillStyle = color + "44";
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 11 * pulse, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(it.type === "green" ? "x2" : "S", 0, 1);
  ctx.restore();
}

// 빛나는 글씨
function neonText(text, x, y, color, align = "left", size = 20) {
  ctx.save();
  ctx.font = "bold " + size + "px sans-serif";
  ctx.textAlign = align;
  ctx.shadowColor = color; ctx.shadowBlur = 12;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ===== 화면 그리기 =====
function draw() {
  ctx.save();
  // 화면 흔들림
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // 배경: 마리오 배경화면 그림 (불러오기 전에는 예전 우주 배경)
  if (bgImg.complete && bgImg.naturalWidth > 0) {
    // 화면을 꽉 채우도록 늘리고, 넘치는 양옆은 잘라냄 (그림이 찌그러지지 않게)
    const scale = Math.max((W + 20) / bgImg.naturalWidth, (H + 20) / bgImg.naturalHeight);
    const bw = bgImg.naturalWidth * scale, bh = bgImg.naturalHeight * scale;
    ctx.drawImage(bgImg, (W - bw) / 2, (H - bh) / 2, bw, bh);
  } else {
    ctx.drawImage(bgCanvas, -10, -10, W + 20, H + 20);
  }

  if (aliens) {
    for (const a of aliens) if (a.alive) drawAlien(a);

    // 내 총알 (노란 레이저)
    ctx.shadowColor = "#ffe600"; ctx.shadowBlur = 14;
    ctx.fillStyle = "#fff8b0";
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 16);

    // 외계인 총알 (빨간 에너지 구슬)
    ctx.shadowColor = "#ff1744"; ctx.shadowBlur = 16;
    for (const b of alienBullets) {
      ctx.fillStyle = "#ff1744";
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffd0d8";
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 1.5, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const it of items) drawItem(it);

    // 내 비행기 (맞은 직후 무적일 때는 깜빡깜빡)
    if (state !== "over" && Math.floor(invincible / 5) % 2 === 0) drawShip(ship.x, ship.y);

    // 방어막 (노란 빛 동그라미)
    if (shield && state !== "over") {
      ctx.save();
      ctx.shadowColor = "#ffe600"; ctx.shadowBlur = 18;
      ctx.strokeStyle = "rgba(255, 230, 0, " + (0.6 + Math.sin(frame * 0.15) * 0.3) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ship.x, ship.y, 38, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // 위쪽: 점수, 스테이지, 목숨(하트)
    neonText("점수: " + score, 18, 34, "#00f0ff");
    neonText("STAGE " + stage, W / 2, 34, "#ff2bd6", "center");
    for (let i = 0; i < 3; i++) drawHeart(30 + i * 30, 62, 11, i < lives);

    // 아래쪽: 아이템 효과 남은 시간
    if (doubleShot > 0) neonText("더블샷 " + Math.ceil(doubleShot / 60) + "초", 18, H - 16, "#39ff14", "left", 16);
    if (shield) neonText("방어막", doubleShot > 0 ? 130 : 18, H - 16, "#ffe600", "left", 16);

    // 스테이지 시작 글씨
    if (banner > 0 && state === "playing") {
      ctx.save();
      ctx.globalAlpha = Math.min(1, banner / 30);
      neonText("STAGE " + stage, W / 2, H / 2, "#ffffff", "center", 56);
      ctx.restore();
    }
  }

  // 폭발 조각 (빛이 겹치면 더 밝게)
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.strokeStyle = p.color;
    if (p.type === "shard") {
      // 작은 세모 조각
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, -p.size); ctx.lineTo(p.size * 0.8, p.size * 0.6); ctx.lineTo(-p.size * 0.8, p.size * 0.6);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.type === "ring") {
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ===== 계속 반복 =====
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
